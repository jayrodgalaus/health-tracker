name: Verify Phase 0
on:
  pull_request:
  push:
    branches: [main, feat/phase-0-foundations]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # A lockfile will be added when dependency installation can be performed.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
