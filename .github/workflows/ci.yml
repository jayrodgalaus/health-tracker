name: Verify Health Tracker
on:
  pull_request:
  push:
    branches: [main, feat/phase-0-foundations, feat/phase-1-profile-weight]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Lockfile will replace npm install with npm ci once generated.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
