name: Stage npm lockfile for review
on:
  push:
    branches: [feat/release-dependency-hardening]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve complete lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion!==3 || p.name!=='health-tracker') process.exit(1); console.log('Resolved '+Object.keys(p.packages).length+' package entries')"
      - name: Publish unattached Git blob only (no branch modification)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 -c 'import json; print(json.dumps({"content":open("package-lock.json",encoding="utf-8").read(),"encoding":"utf-8"}))' > /tmp/lockfile-blob.json
          blob=$(gh api -X POST "repos/$GH_REPO/git/blobs" --input /tmp/lockfile-blob.json --jq '.sha')
          echo "LOCKFILE_BLOB_SHA=$blob"
          echo "Lockfile remains unattached until committed through the connected GitHub workflow."
